spring:
  application:
    name: gava-hub-backend
  profiles:
    default: local
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/gavahub}
    username: ${DATABASE_USERNAME:gavahub}
    password: ${DATABASE_PASSWORD:gavahub}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: GavaHubPool
      minimum-idle: ${DATABASE_POOL_MIN_SIZE:2}
      maximum-pool-size: ${DATABASE_POOL_MAX_SIZE:20}
      connection-timeout: 10000
      validation-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: gavahub
        jdbc:
          batch_size: 50
          time_zone: UTC
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: gavahub
    schemas: gavahub
    create-schemas: true
    clean-disabled: true
    validate-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
      connect-timeout: 2s
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_SIZE:20MB}
      max-request-size: ${MAX_REQUEST_SIZE:22MB}
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  compression:
    enabled: true
    min-response-size: 1KB
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

management:
  server:
    port: ${MANAGEMENT_PORT:8080}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  config: classpath:logback-spring.xml
  level:
    root: INFO
    com.gavahub: INFO

gava-hub:
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:3000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  security:
    issuer: ${JWT_ISSUER:gava-hub}
    audience: ${OIDC_AUDIENCE:gava-hub-api}
    jwt-secret: ${GAVA_HUB_JWT_SECRET:local-development-secret-change-me-123456789}
    token-ttl: ${JWT_TOKEN_TTL:PT1H}
  documents:
    provider: ${DOCUMENT_STORAGE_PROVIDER:LOCAL}
    bucket: ${DOCUMENT_BUCKET:gava-hub-local}
    local-root: ${DOCUMENT_LOCAL_ROOT:./data/documents}
    endpoint: ${OBJECT_STORAGE_ENDPOINT:}
    region: ${OBJECT_STORAGE_REGION:af-south-1}
    signed-url-ttl: ${DOCUMENT_SIGNED_URL_TTL:PT5M}
  mpesa:
    environment: ${MPESA_ENVIRONMENT:sandbox}
    consumer-key: ${MPESA_CONSUMER_KEY:}
    consumer-secret: ${MPESA_CONSUMER_SECRET:}
    shortcode: ${MPESA_SHORTCODE:}
    passkey: ${MPESA_PASSKEY:}
    callback-base-url: ${MPESA_CALLBACK_BASE_URL:}
    callback-secret: ${MPESA_CALLBACK_SECRET:local-mpesa-callback-secret-change-me}
    connect-timeout: 5s
    read-timeout: 20s
  notifications:
    from-email: ${NOTIFICATION_FROM_EMAIL:no-reply@gavahub.local}
    sms-url: ${SMS_PROVIDER_URL:}
    sms-api-key: ${SMS_PROVIDER_API_KEY:}
    max-attempts: ${NOTIFICATION_MAX_ATTEMPTS:5}
    poll-delay: ${NOTIFICATION_POLL_DELAY:PT10S}
  contact:
    support-email: ${CONTACT_SUPPORT_EMAIL:support@gavahub.co.ke}
