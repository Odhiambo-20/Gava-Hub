spring:
  config:
    activate:
      on-profile: production
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      minimum-idle: ${DATABASE_POOL_MIN_SIZE:5}
      maximum-pool-size: ${DATABASE_POOL_MAX_SIZE:40}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

server:
  tomcat:
    threads:
      max: ${SERVER_MAX_THREADS:200}
    max-connections: ${SERVER_MAX_CONNECTIONS:8192}

management:
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: WARN
    com.gavahub: INFO
    org.springframework.security: WARN

gava-hub:
  public-base-url: ${PUBLIC_BASE_URL}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  security:
    issuer: ${JWT_ISSUER:gava-hub}
    jwt-secret: ${GAVA_HUB_JWT_SECRET}
  documents:
    bucket: ${DOCUMENT_BUCKET}
    endpoint: ${OBJECT_STORAGE_ENDPOINT:}
    region: ${OBJECT_STORAGE_REGION}
  mpesa:
    environment: production
    consumer-key: ${MPESA_CONSUMER_KEY}
    consumer-secret: ${MPESA_CONSUMER_SECRET}
    shortcode: ${MPESA_SHORTCODE}
    passkey: ${MPESA_PASSKEY}
    callback-base-url: ${MPESA_CALLBACK_BASE_URL}
    callback-secret: ${MPESA_CALLBACK_SECRET}
  notifications:
    from-email: ${NOTIFICATION_FROM_EMAIL}
    sms-url: ${SMS_PROVIDER_URL}
    sms-api-key: ${SMS_PROVIDER_API_KEY}
  contact:
    support-email: ${CONTACT_SUPPORT_EMAIL}
