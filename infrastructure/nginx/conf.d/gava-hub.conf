upstream frontend {
    server frontend:3000;
    keepalive 32;
}

upstream backend {
    server backend:8080;
    keepalive 32;
}

server {
    listen 8080;
    server_name _;

    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "healthy\n";
    }

    location ~ ^/api/v1/(payments|invoices) {
        limit_req zone=payment burst=10 nodelay;
        proxy_pass http://backend;
        include /etc/nginx/conf.d/proxy-headers.conf;
    }

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://backend;
        include /etc/nginx/conf.d/proxy-headers.conf;
    }

    location /actuator/ {
        deny all;
        return 404;
    }

    location / {
        proxy_pass http://frontend;
        include /etc/nginx/conf.d/proxy-headers.conf;
    }
}
