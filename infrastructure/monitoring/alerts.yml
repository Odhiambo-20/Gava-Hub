groups:
  - name: gava-hub
    rules:
      - alert: BackendUnavailable
        expr: up{job="gava-hub-backend"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Gava Hub backend is unavailable
          description: Prometheus has been unable to scrape the backend for two minutes.

      - alert: HighServerErrorRate
        expr: |
          sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(http_server_requests_seconds_count[5m])), 1)
          > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Elevated backend error rate
          description: More than five percent of backend requests are returning 5xx responses.

      - alert: SlowBackendResponses
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(http_server_requests_seconds_bucket[5m]))
          ) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Backend p95 latency is above two seconds
          description: Backend response latency has remained elevated for ten minutes.
