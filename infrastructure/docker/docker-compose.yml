name: gava-hub

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gavahub}
      POSTGRES_USER: ${POSTGRES_USER:-gavahub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  redis:
    image: ${REDIS_IMAGE:-redis:8-alpine}
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    volumes:
      - redis-data:/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '$${REDIS_PASSWORD}' ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      GAVA_HUB_JWT_SECRET: ${GAVA_HUB_JWT_SECRET:?Set GAVA_HUB_JWT_SECRET in .env}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Set PUBLIC_BASE_URL in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS in .env}
    security_opt:
      - no-new-privileges:true

  backend:
    profiles: ["app"]
    image: ${BACKEND_IMAGE:-gavahub/backend:latest}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-production}
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-gavahub}
      DATABASE_USERNAME: ${POSTGRES_USER:-gavahub}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      MPESA_ENVIRONMENT: ${MPESA_ENVIRONMENT:-sandbox}
      MPESA_CONSUMER_KEY: ${MPESA_CONSUMER_KEY:-}
      MPESA_CONSUMER_SECRET: ${MPESA_CONSUMER_SECRET:-}
      MPESA_SHORTCODE: ${MPESA_SHORTCODE:-}
      MPESA_PASSKEY: ${MPESA_PASSKEY:-}
      MPESA_CALLBACK_BASE_URL: ${MPESA_CALLBACK_BASE_URL:-}
      MPESA_CALLBACK_SECRET: ${MPESA_CALLBACK_SECRET:?Set MPESA_CALLBACK_SECRET in .env}
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST in .env}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      NOTIFICATION_FROM_EMAIL: ${NOTIFICATION_FROM_EMAIL:?Set NOTIFICATION_FROM_EMAIL in .env}
      CONTACT_SUPPORT_EMAIL: ${CONTACT_SUPPORT_EMAIL:?Set CONTACT_SUPPORT_EMAIL in .env}
      SMS_PROVIDER_URL: ${SMS_PROVIDER_URL:-}
      SMS_PROVIDER_API_KEY: ${SMS_PROVIDER_API_KEY:-}
      DOCUMENT_STORAGE_PROVIDER: LOCAL
      DOCUMENT_LOCAL_ROOT: /var/lib/gavahub/documents
      DOCUMENT_BUCKET: ${DOCUMENT_BUCKET:-gava-hub-documents}
    volumes:
      - document-data:/var/lib/gavahub/documents
    expose:
      - "8080"
    networks:
      - app
      - data
      - monitoring
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    security_opt:
      - no-new-privileges:true

  frontend:
    profiles: ["app"]
    image: ${FRONTEND_IMAGE:-gavahub/frontend:latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      API_BASE_URL: http://backend:8080
    expose:
      - "3000"
    networks:
      - app
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true

  nginx:
    profiles: ["app"]
    image: ${NGINX_IMAGE:-nginx:1.28-alpine}
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:8080"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/conf.d:/etc/nginx/conf.d:ro
    networks:
      - app
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

  prometheus:
    profiles: ["monitoring"]
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.5.0}
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
      - --web.enable-lifecycle
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    expose:
      - "9090"
    networks:
      - monitoring
    security_opt:
      - no-new-privileges:true

  grafana:
    profiles: ["monitoring"]
    image: ${GRAFANA_IMAGE:-grafana/grafana:12.1.0}
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3001}
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - monitoring
    depends_on:
      - prometheus
    security_opt:
      - no-new-privileges:true

networks:
  app:
  data:
    internal: true
  monitoring:

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:
  document-data:
